<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomasz Kucz - Tabela</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <table>
        <tr>
            <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
        </tr>
        <tr>
            <th>2</th><td>a</td><td>b</td><td>c</td><td>d</td><td>e</td>
        </tr>
        <tr>
            <th>3</th><td>f</td><td>g</td><td>h</td><td>i</td><td>j</td>
        </tr>
        <tr>
            <th>4</th>
            <td colspan="5" rowspan="2" class="marked">
                k, l, m, n, o, p, q, r, s, t
            </td>
        </tr>
        <tr>
            <th>5</th>
        </tr>
        <tr>
            <th>6</th><td>u</td><td>v</td><td>w</td><td>y</td><td>z</td>
        </tr>
    </table>
</body>
</html>
